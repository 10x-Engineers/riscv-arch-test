# yaml-language-server: $schema=https://raw.githubusercontent.com/riscv/riscv-unified-db/main/spec/schemas/config_schema.json
---
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: spacemit-k3-pico-itx
description: >
  SpacemiT K3 Pico-ITX (X100 cores), first ACT configuration. Started from the BPI-F3 (K1/X60)
  configuration and changed where the K3 was measured with the runner's CSR probe on the board
  (runner repo artifacts/onboarding/spacemit_k3_20261019/csr_probe_v6/): IDs, PMP entries,
  medeleg/mideleg masks, VLEN 256, Sv39 only, ASID 16, PMP granularity 4 KiB, PA 40 bits,
  misaligned scalar loads in hardware. Revision 2 adds the RVA23S64 extensions the board's
  device tree lists in riscv,isa-extensions (runner repo
  artifacts/onboarding/spacemit_k3_20261019/observation.md), including the hypervisor ones:
  H is present with misa.H = 0 at reset (writable; RVMODEL_BOOT sets it). The H parameters
  are the K3 values measured with the CSR probe (observation.md, "Hypervisor CSRs"). Za128rs follows from Za64rs. Not in the device tree, so not declared: Ziccrse,
  Zic64b, Supm. Zicclsm (in the device tree) waits for a board check of misaligned vector
  accesses: Sail rejects it while those raise access faults, the K1 value kept here.
  Parameters not listed above are the K1's values, or for the revision 2 extensions upstream's
  sail-RVA23S64 values, and UNVERIFIED on the K3.

