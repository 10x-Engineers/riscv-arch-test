name: spacemit-k3-pico-itx
compiler_exe: riscv64-unknown-elf-gcc
objdump_exe: riscv64-unknown-elf-objdump
ref_model_exe: sail_riscv_sim
udb_config: spacemit-k3-pico-itx.yaml
linker_script: link.ld
dut_include_dir: .
# Tests that do not complete under this board's UART runner; each would wait out the result timeout.
exclude_tests:
  - PMP_Sm_cfg_A_tor_zero
  - Svnapot_sv39_Svnapot_reserved_enc
  # Need RVMODEL_ACCESS_FAULT_ADDRESS, which the K3 has none of (afault_probe; HW-7: high physical
  # address bits alias to memory): they do not link.
  - SdtrigS_etrigger_s
  - SdtrigSm_etrigger_m
  - SdtrigSm_etrigger_cross_priv_s
  - SdtrigSm_etrigger_cross_priv_u
  - SdtrigU_etrigger_u
  # Every case has a tag above the 40-bit physical width that Bare mode does not mask (HW-7).
  - Smnpm_S_bare_pmm00_sweep_hightags
  - Ssnpm_bare_pmm00_sweep_hightags
# The runner streams each ELF over 115200-baud UART and dumps the whole signature region as [SIGQ] lines on
# failure. Self-checking tests report the failure in the RVCP/[FAILQ]/[REGS] lines, so the dump carries nothing
# triage uses: keep 64 bytes of it. k3-act-loop #2: 2.2M [SIGQ] lines (~2.4 h of 6.2 h), and 4 Sdtrig tests with
# ~1.9 MB signatures hit the 900 s result timeout mid-dump. ci/k3-loop/Jenkinsfile refuses ELFs above 4 KiB.
final_elf_discard_locals: true
final_elf_signature_dump_bytes: 64
# Cases that stop at a known K3 hardware deviation; the rest of each test still runs.
exclude_cases_file: exclude_cases.tsv
# Board debug loop (k3-act-loop job): the only tests this branch runs. Iteration 1: the suites the
# AIA, Sdtrig and stateen CONTEXT config changes affect (k3-uart-weekly #6 follow-up).
include_tests:
  - SdtrigS
  - SdtrigSm
  - SdtrigU
  - Smstateen
  - Ssstateen
  - H
