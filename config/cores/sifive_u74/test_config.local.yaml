name: visionfive2-rv64gc
compiler_exe: riscv64-unknown-elf-gcc
objdump_exe: riscv64-unknown-elf-objdump
ref_model_exe: sail_riscv_sim
udb_config: visionfive2-rv64gc.yaml
linker_script: link.ld
dut_include_dir: .
# The runner streams each ELF over 115200-baud UART and dumps the whole signature region on failure (~1 h per
# MB). Self-checking tests report the failure in the RVCP/[FAILQ]/[REGS] lines, so keep 64 bytes of the dump;
# ci/vf2-loop/Jenkinsfile refuses ELFs above 4 KiB before the board.
final_elf_discard_locals: true
final_elf_signature_dump_bytes: 64
# Cases dropped before build (Sail cannot model the board; see the reason column).
exclude_cases_file: exclude_cases.tsv
# Full regression (vf2-uart-weekly): every selected test, with the exclusions above. Debug-loop selections
# (include_tests) live on vf2/loop.
