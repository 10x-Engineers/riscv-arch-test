  TRAP_ON_EBREAK: true
  MARCHID_IMPLEMENTED: true
  ARCH_ID_VALUE: 0x8000000058000002
  MIMPID_IMPLEMENTED: true
  IMP_ID_VALUE: 0x33d8a600
  VENDOR_ID_BANK: 14      # mvendorid 0x710 = bank 14, offset 16
  VENDOR_ID_OFFSET: 16
  MISALIGNED_LDST: true          # csr_probe: misaligned lw completes in hardware
  MISALIGNED_LDST_EXCEPTION_PRIORITY: low
  MISALIGNED_MAX_ATOMICITY_GRANULE_SIZE: 0
