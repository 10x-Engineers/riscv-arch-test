  SCOUNTENABLE_EN:
    [
      true,  # 0: cycle
      true,  # 1: time
      true,  # 2: instret
      true,  # 3
      true,  # 4
      true,  # 5
      true,  # 6
      true,  # 7
      true,  # 8
      true,  # 9
      true,  # 10
      true,  # 11
      true,  # 12
      true,  # 13
      true,  # 14
      true,  # 15
      true,  # 16
