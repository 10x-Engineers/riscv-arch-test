  # ---------------- H ----------------
  # Measured with the CSR probe with misa.H set (runner repo
  # artifacts/onboarding/spacemit_k3_20261019/observation.md, "Hypervisor CSRs", 2026-10-22):
  # hgatp Sv39x4 only (Sv48x4/Sv57x4 legalize to Bare), VMID 14 bits, hgeie writable 0xfe
  # (GEILEN 7), hcounteren writable 0x7ffff (CY, TM, IR, HPM3-18), hstatus.VSXL fixed 64.
  MUTABLE_MISA_H: true           # the probe sets misa.H; RVMODEL_BOOT does the same
  VMID_WIDTH: 14
  NUM_EXTERNAL_GUEST_INTERRUPTS: 7
  GSTAGE_MODE_BARE: true
  SV39X4_TRANSLATION: true
  SV48X4_TRANSLATION: false
  SV57X4_TRANSLATION: false
  VSSTAGE_MODE_BARE: true
  SV39_VSMODE_TRANSLATION: true  # the K3 is Sv39 only
  SV48_VSMODE_TRANSLATION: false
  SV57_VSMODE_TRANSLATION: false
  VSXLEN: [64]
  VUXLEN: [64]
  VS_MODE_ENDIANNESS: little
