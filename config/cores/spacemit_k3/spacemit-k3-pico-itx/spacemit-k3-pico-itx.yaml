      true,  # 18
      false, # 19: hpmcounter19 not implemented on real K1 silicon (K1 value, UNVERIFIED on the K3)
      false, # 20
      false, # 21
      false, # 22
      false, # 23
      false, # 24
      false, # 25
      false, # 26
      false, # 27
      false, # 28
      false, # 29
      false, # 30
      false, # 31
    ]
  STVEC_MODES: [0, 1]
  STVEC_BASE_ALIGNMENT_VECTORED: 4
  SATP_MODE_BARE: true
  TRAP_ON_ECALL_FROM_S: true
  SEI_INTR_IMPL: true
  SSI_INTR_IMPL: true
  STI_INTR_IMPL: true
  MSTATUS_VS_LEGAL_VALUES: [0, 1, 2, 3]
  # Sm params
  MXLEN: 64
  PRECISE_SYNCHRONOUS_EXCEPTIONS: true
  TRAP_ON_ECALL_FROM_M: true
  MEI_INTR_IMPL: true
  MSI_INTR_IMPL: true
  MTI_INTR_IMPL: true
  # K1 WFI may wait indefinitely until a wake-up event occurs. K1 value, UNVERIFIED on the K3.
